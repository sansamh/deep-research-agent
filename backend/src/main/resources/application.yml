spring:
  application:
    name: deepprobe
  datasource:
    url: jdbc:h2:file:./data/deepprobe;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.4

app:
  tavily:
    api-key: ${TAVILY_API_KEY:}
  research:
    max-subquestions: 5
    max-tool-iterations: 4
    search-results-per-query: 5
    max-page-chars: 6000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173,http://localhost:5175

server:
  port: 8081
